<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Profissional</title>
    <link rel="stylesheet" href="../CSS/edicao_funcionario.css">
</head>

<body>

    <aside class="sidebar">
        <div class="logo">
            <div class="logo_nome">
                <img class="logo_empresa" src="../Img/logo_laranja.png">
                <h1><span>Con</span>Group</h1>
            </div>
        </div>

        <nav>
            <a href="../html/perfilProfissional.html" class="ativo">Seu perfil</a>
            <a href="../html/informacao_obra.html">Obras</a>

        </nav>

        <div class="sair">
            <div class="user">
                <a href="../html/login.html">
                    <h1>sair</h1>
                </a>
            </div>
        </div>
    </aside>

    <main class="container">

        <div class="topo">

             <h1>Editar Perfil do <span>Profissional</span></h1>

            <div class="acoes">
                <button class="btn-cancelar">
                    Cancelar
                </button>

                <button class="btn-salvar">
                    Salvar Alterações
                </button>
            </div>

        </div>

        <section class="perfil">

            <div class="card-foto">
                <img src="../Img/perfil.png" alt="">

                <button class="btn-foto">
                    Alterar Foto
                </button>

                <input type="text" value="João Carlos da Silva">

                <input type="text" value="Pedreiro">

            </div>

            <div class="card-info">

                <h3>Informações Pessoais</h3>

                <div class="info">
                    <span>Nome Completo</span>
                    <input type="text" value="João Carlos da Silva">
                </div>

                <div class="info">
                    <span>Telefone</span>
                    <input type="text" value="(11) 99999-9999">
                </div>

                <div class="info">
                    <span>Email</span>
                    <input type="email" value="joao@email.com">
                </div>

                <div class="info">
                    <span>Endereço</span>
                    <input type="text" value="Rua das Flores, 123">
                </div>

                <div class="info">
                    <span>Idade</span>
                    <input type="number" value="35">
                </div>

                <div class="info">
                    <span>Tempo de Experiência</span>
                    <input type="text" value="10 anos">
                </div>

                <div class="info">
                    <span>Cargo</span>
                    <input type="text" value="Pedreiro">
                </div>

                <div class="info">
                    <span>CPF</span>
                    <input type="text" value="123.456.789-00">
                </div>

                <div class="info">
                    <span>Salário</span>
                    <input type="text" value="R$ 3.500,00">
                </div>

            </div>

        </section>

        <section class="biografia">

            <h3>Biografia</h3>

            <textarea>
Profissional com mais de 10 anos de experiência na construção civil, especializado em alvenaria, reboco e acabamento.
            </textarea>

        </section>

    </main>

</body>

</html>
